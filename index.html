<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Nature v2.0 by Threepixels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            font-family: "Trebuchet MS", Arial, sans-serif;
        }
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #container canvas {
            max-width: 100%;
            max-height: 100%;
        }
        #loading {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 50% 42%, rgba(61, 93, 85, 0.32), transparent 30%),
                radial-gradient(ellipse at 50% 110%, rgba(85, 49, 79, 0.34), transparent 55%),
                linear-gradient(145deg, #020807 0%, #07110f 48%, #090609 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 1000;
            isolation: isolate;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        #loading.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #loading::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            opacity: 0.18;
            background: repeating-linear-gradient(
                0deg,
                transparent 0,
                transparent 2px,
                rgba(180, 220, 204, 0.08) 3px
            );
            pointer-events: none;
        }
        .launch-card {
            width: min(90vw, 640px);
            padding: clamp(32px, 7vw, 66px) clamp(26px, 7vw, 72px) 38px;
            text-align: center;
        }
        .presented-by {
            color: #769287;
            font-size: 10px;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            margin: 0 0 23px 0.42em;
        }
        #loading h1 {
            color: #dbe8e1;
            font: italic 400 clamp(46px, 12vw, 104px)/0.72 Georgia, "Times New Roman", serif;
            letter-spacing: -0.08em;
            text-shadow: 0 0 32px rgba(137, 194, 172, 0.18);
            margin: 0;
            white-space: nowrap;
        }
        #loading h1 .version-number {
            font-size: 1.15em;
        }
        .launch-action {
            height: 64px;
            margin-top: 42px;
        }
        #loading .progress-bar {
            width: min(100%, 320px);
            height: 1px;
            margin: 0 auto;
            background: rgba(115, 145, 133, 0.2);
            overflow: hidden;
        }
        #loading .progress-fill {
            width: 0%;
            height: 100%;
            background: #a9c8bb;
            box-shadow: 0 0 8px #8cb5a4;
            transition: width 0.3s ease;
        }
        #loading .status {
            min-height: 15px;
            margin-top: 13px;
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #526a61;
        }
        #startButton {
            display: none;
            margin: 0 auto;
            padding: 7px 3px;
            color: #c9dbd3;
            background: transparent;
            border: 0;
            outline: 0;
            font: 13px/1.5 "Trebuchet MS", Arial, sans-serif;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            text-decoration: underline;
            text-underline-offset: 7px;
            cursor: pointer;
            transition: color 0.2s;
        }
        #startButton:not(:disabled):hover,
        #startButton:not(:disabled):focus-visible {
            color: #f2f7f4;
        }
        #startButton:disabled {
            cursor: progress;
            text-decoration: none;
        }
        #loading.ready .progress-bar,
        #loading.ready .status {
            display: none;
        }
        #loading.ready #startButton {
            display: block;
        }
        .launcher-footer {
            position: absolute;
            left: 50%;
            bottom: 18px;
            width: calc(100% - 8px);
            color: #526a61;
            font-size: 11px;
            line-height: 1.6;
            letter-spacing: 0.14em;
            text-align: center;
            transform: translateX(-50%);
        }
        .launcher-footer kbd {
            color: #769287;
            font: inherit;
        }
        .launcher-footer a {
            display: inline-block;
            margin-top: 8px;
            color: #526a61;
            text-decoration: none;
            transition: color 0.2s;
        }
        .launcher-footer a:hover,
        .launcher-footer a:focus-visible {
            color: #a9c8bb;
        }
        @media (max-width: 520px) {
            .launcher-footer {
                font-size: 10px;
                letter-spacing: 0.04em;
            }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="launch-card">
            <p class="presented-by">Threepixels · 2001</p>
            <h1>Nature v<span class="version-number">2.0</span></h1>
            <div class="launch-action">
                <div class="progress-bar" role="progressbar" aria-label="Loading demo">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="status" id="progress">Loading...</div>
                <button id="startButton" type="button" disabled>start</button>
            </div>
        </div>
        <div class="launcher-footer">
            <kbd>space</kbd> pause &nbsp;·&nbsp; <kbd>← →</kbd> seek
            &nbsp;·&nbsp; <kbd>f</kbd> fullscreen &nbsp;·&nbsp; <kbd>esc</kbd> stop
            <br>
            <a href="https://github.com/demoports/3px_ntr2" target="_blank" rel="noopener noreferrer">github</a>
        </div>
    </div>
    <div id="container"></div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
            "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"
        }
    }
    </script>
    <script type="module">
        import { DemoApp } from './src/main.js';
        const app = new DemoApp( 'data.dat' );
        app.init();
    </script>
</body>
</html>
